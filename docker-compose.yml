services:   
  app:
    image: python:3.12-slim
    volumes:
      - ./app:/workspace
      - ./pip-cache:/root/.cache/pip
    ports:
      - "5000:5000"
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    command: >
      sh -c "
        if [ ! -f /workspace/venv/bin/activate ]; then python -m venv /workspace/venv; fi &&
        . /workspace/venv/bin/activate &&
        pip install -r requirements.txt &&
        python run.py
      "
volumes:
  pip-cache:
